{% extends 'base.html' %}{% block title %}پرداخت | رمـیصا{% endblock %}{% block content %}<section class="checkout"><h1>تکمیل سفارش</h1>{% if items %}<form method="post" class="checkout-form">{% csrf_token %}<label>نام و نام خانوادگی<input name="name" required></label><label>شماره تماس<input name="phone" required></label><label>آدرس کامل<textarea name="address" required></textarea></label><div class="summary"><p>مبلغ سفارش <b>{{ total|floatformat:0 }} تومان</b></p><button class="btn full">ثبت سفارش</button></div></form>{% else %}<p>سبد خرید خالی است.</p>{% endif %}</section>{% endblock %}
